<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none" class="w-auto h-full">
  <defs>
    <!-- Gradient for Wave -->
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>

    <!-- Gradient for Foam -->
    <linearGradient id="foamGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0fbfc" />
    </linearGradient>

    <!-- Gradient for Text Accent -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#48cae4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON: Surf Wave & Board Emblem -->
  <g transform="translate(4, 3)">
    <!-- Outer Dynamic Wave Barrel -->
    <path d="M6 38 C6 20, 20 8, 38 8 C48 8, 48 18, 38 20 C26 22, 18 28, 18 38 C18 42, 28 44, 34 38 C36 36, 40 32, 44 26 C46 36, 38 46, 26 46 C12 46, 6 44, 6 38 Z" fill="url(#waveGradient)" filter="url(#glow)" />
    
    <!-- Secondary Wave Spray -->
    <path d="M12 36 C14 24, 24 16, 34 14 C30 18, 24 24, 22 34 C20 37, 14 38, 12 36 Z" fill="url(#foamGradient)" opacity="0.9" />

    <!-- Sleek Aerodynamic Surfboard in Motion -->
    <path d="M18 44 C26 36, 36 22, 46 6 C47 5, 48 5, 48 7 C44 22, 34 38, 24 46 C20 49, 16 47, 18 44 Z" fill="url(#foamGradient)" />

    <!-- Bioluminescent Accent Sparkle -->
    <circle cx="46" cy="7" r="2.5" fill="#00f5d4" />
  </g>

  <!-- WORDMARK TYPOGRAPHY -->
  <g transform="translate(62, 0)">
    <!-- "SURF" in Crisp Clean White -->
    <text x="0" y="33" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="25" letter-spacing="1.5" fill="#ffffff">SURF</text>
    
    <!-- "WAVE" in Glowing Cyan -->
    <text x="75" y="33" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="25" letter-spacing="1.5" fill="url(#textGradient)">WAVE</text>

    <!-- Subtitle: ARUGAM BAY -->
    <text x="1" y="47" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="7.5" letter-spacing="3.5" fill="#90e0ef" opacity="0.95">ARUGAM BAY • SRI LANKA</text>
  </g>
</svg>
